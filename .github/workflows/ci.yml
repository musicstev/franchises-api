name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, test and verify coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, run tests and check coverage (95% minimum)
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
        # Runs unit tests (Surefire) and the Testcontainers integration test (Failsafe,
        # backed by Docker, preinstalled on GitHub-hosted runners), then fails the build
        # if JaCoCo instruction coverage drops below the 95% gate configured in pom.xml.

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test results
          path: '**/target/surefire-reports/*.xml,**/target/failsafe-reports/*.xml'
          reporter: java-junit

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Build Docker image
        run: docker build -t franchises-api:${{ github.sha }} .
